[project]
name = "zeff"
version = "0.1.0"
description = "Z-score estimator for NBA fantasy drafts"
requires-python = ">=3.10"
dependencies = [
    "curl_cffi>=0.7",
    "pandas>=2.0",
    "numpy>=1.24",
    "lxml>=4.9",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
